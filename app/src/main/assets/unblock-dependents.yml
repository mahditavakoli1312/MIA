# .github/workflows/unblock-dependents.yml
# Managed by MIA — kept byte-for-byte in sync with docs/github/.
#
# When one issue closes, the issues that were waiting on it go back into the queue.
#
# Without this, a decomposed brief delivers its first child and then stops: the dependents keep
# their `blocked` label forever, the queue is empty, no run fails, and nobody notices until
# somebody asks why the feature never shipped. A plan that cannot advance itself is not a plan.
#
# The daily cron is not redundant. Issues get closed while Actions is disabled, during an outage,
# or by a merge that raced this workflow — and a dependency chain that needs a human to notice it
# stalled is the failure this file exists to remove.
name: Unblock dependents

on:
  issues:
    types: [closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Never in parallel with itself: two sweeps could queue the same issue twice and start two runs
# on one branch.
concurrency:
  group: mia-unblock
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # A released dependent is queued with GITHUB_TOKEN, which fires no workflow — so this sweep
  # dispatches the drain itself. Without it the issue it just freed waits for the timer.
  actions: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Release whatever was waiting
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          # Empty on the cron and manual runs, which then sweep every blocked issue.
          CLOSED_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ ! -f .github/scripts/unblock.js ]; then
            echo "::notice::This repo has no .github/scripts/unblock.js — update the AI-team files from the MIA app."
            exit 0
          fi
          node .github/scripts/unblock.js

      # The top of the loop. A closed child may have been the last one a brief was waiting for,
      # and a brief that stays open after everything it asked for shipped is the same dead end
      # one level up.
      - name: Check whether a brief is now complete
        if: github.event.issue.number != ''
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOSED_ISSUE: ${{ github.event.issue.number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_FALLBACK: ${{ secrets.OPENROUTER_API_KEY_FALLBACK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          AGENT_MODEL_PO: ${{ vars.AGENT_MODEL_PO || vars.AGENT_MODEL || 'minimax/minimax-m3:free' }}
          AGENT_PROVIDER_PO: ${{ vars.AGENT_PROVIDER_PO || vars.AGENT_PROVIDER || 'openrouter' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f .github/scripts/brief-close.js ]; then
            echo "::notice::This repo has no .github/scripts/brief-close.js — skipping the brief check."
            exit 0
          fi
          node .github/scripts/brief-close.js || true
