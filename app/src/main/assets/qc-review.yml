# Managed by MIA — do not edit by hand (kept byte-for-byte in sync with docs/github/).
#
# QC, as a gate on TEC's pull requests rather than an advisor someone remembers to summon.
#
# It runs on every pull request TEC opens (branch `tec/issue-<n>`), reviews the diff against that
# issue's acceptance criteria, and leaves its verdict as a label the TEC workflow is waiting for:
#
#   qc-approved  → TEC merges, exactly as it did before this workflow existed.
#   qc-skipped   → QC could not review (no key, quota, unusable answer). TEC merges anyway.
#
# THERE IS NO THIRD OUTCOME. QC does not stop a merge and does not send an issue back.
#
# It used to: `needs-rework` held the pull request open and re-queued the same issue, twice, and
# then `needs-po` had the PO rewrite the brief, and past `AGENT_MAX_CYCLES` the whole thing
# stopped for a human. Because only one `tec/issue-*` branch may be in flight at a time, every
# one of those states froze the ENTIRE queue behind one contested diff — which is how a planned
# brief ends the day with nothing merged.
#
# What QC objects to is now opened as a NEW issue carrying `by-agent`. The queue is ordered
# oldest-first, so that issue is worked after everything already planned: the brief ships in the
# order the PO planned it, and QC's improvements follow it. Nothing is dropped, nothing is
# blocked, and the follow-up issue is the record of what the merge left undone.
#
# See .github/scripts/qc-review.js.
name: QC Review (PR gate)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per PR. A `synchronize` burst (two pushes in a row) would otherwise have two reviews
# racing to set contradictory verdict labels; cancelling the older one is right, because the newer
# push is what TEC's gate is waiting for a verdict on.
concurrency:
  group: qc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Only TEC's own pull requests. A human's PR is reviewed by humans, and the branch name is
    # where the issue number comes from.
    if: startsWith(github.event.pull_request.head.ref, 'tec/issue-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # The verdict labels have to exist before anything can attach one.
      #
      # The last three are no longer QC's. It only ever applies qc-approved or qc-skipped now.
      # They are created here because they are still real states with real owners — triage puts a
      # failed run on `needs-po`, the shepherd and triage both use `needs-human`, and a person may
      # still mark an issue `needs-rework` by hand — and adding a label to an issue does not
      # create a missing one. This is the workflow every repo has, so this is where they are made.
      - name: Ensure the verdict labels exist
        run: |
          create() {
            gh label create "$1" --color "$2" --description "$3" --repo "$REPO" 2>/dev/null || true
          }
          create qc-approved 0e8a16 "QC approved this pull request"
          create qc-skipped bfd4f2 "QC could not review — merging is not blocked"
          create needs-rework d93f0b "Changes are wanted before this merges (set by a person)"
          create needs-po 5319e7 "The PO is re-scoping this issue"
          create needs-human b60205 "Waiting on one decision from a person — resumes on any comment"

      # AGENTS.md and the acceptance criteria are the standard QC judges against, so the review
      # needs the repo, not just the diff.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The diff goes to a FILE, never into an env var or a shell argument: it is agent-produced
      # text of arbitrary length and content.
      - name: Read the diff and the issue number
        id: pr
        run: |
          gh pr diff "$PR_NUMBER" --repo "$REPO" > "${RUNNER_TEMP}/pr.diff" || true
          # tec/issue-42 → 42. The branch name is the only link between a PR and its issue that
          # survives a squash-merge and a deleted branch.
          issue="${HEAD_REF##*/issue-}"
          case "$issue" in
            ''|*[!0-9]*) echo "::warning::Could not read an issue number out of '$HEAD_REF'." ;;
            *) echo "issue=$issue" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Review the pull request
        if: steps.pr.outputs.issue != ''
        env:
          # The same secrets and model every other role uses — see .github/scripts/ai-provider.js.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_FALLBACK: ${{ secrets.OPENROUTER_API_KEY_FALLBACK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Optional. Only the GLM vision/OCR/image skills read it, and skills.js does not
          # even OFFER a skill whose key is unset — so an empty secret here is a smaller
          # skill list, not a failure.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # QC's own model, falling back to the repo-wide one and then to this literal
          # default, which the MIA app's model management screen rewrites.
          # Raw model id — NO provider prefix: this script calls the provider's API directly.
          AGENT_MODEL_QC: ${{ vars.AGENT_MODEL_QC || vars.AGENT_MODEL || 'minimax/minimax-m3:free' }}
          AGENT_PROVIDER_QC: ${{ vars.AGENT_PROVIDER_QC || vars.AGENT_PROVIDER || 'openrouter' }}
          # How long a chain of QC follow-ups may get before QC stops opening them and leaves
          # the remainder to a person. Default 2. This is the only end this loop has: nothing
          # else in the gate ever declines to continue.
          AGENT_MAX_FOLLOWUPS: ${{ vars.AGENT_MAX_FOLLOWUPS }}
          # AGENT_MAX_CYCLES and AGENT_PAUSE_TIMEOUT used to be passed here. They belonged to the
          # QC → PO → TEC rework loop and the pause at the end of it; QC no longer has either, so
          # passing them would only suggest they still do something.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.issue }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # An older bootstrap has the workflow but not the scripts. Say so on the PR and let the
          # merge proceed — a missing reviewer is not a reason to block a change.
          if [ ! -f .github/scripts/qc-review.js ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "✅ This repo has no \`.github/scripts/qc-review.js\`, so QC did not review this pull request. Merging is not blocked. Copy \`docs/github/scripts/\` (all of it — the script needs \`ai-provider.js\` too) into this repo to enable the gate."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label qc-skipped || true
            exit 0
          fi
          node .github/scripts/qc-review.js
