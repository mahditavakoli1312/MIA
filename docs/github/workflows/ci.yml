# Managed by MIA — do not edit by hand (kept byte-for-byte in sync with docs/github/).
#
# Plain continuous integration: build the app on pushes to the default branch and on every
# pull request (including the ones the TEC agent opens). It's defensive — a freshly created
# MIA repo starts as a README with no Gradle project, so the build step no-ops (green) until
# real code lands, then starts actually assembling the debug APK.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The agent team's own health check, run against the copy this repo actually has.
      #
      # A generated repo's `.github/scripts/` can be edited by hand — and the one thing that must
      # survive any edit is that every state an issue can be in has an owner and a way out. A
      # broken table here produces no failure at runtime: issues simply stop moving, which looks
      # exactly like nobody having filed any.
      - name: Check the agent state table
        if: ${{ hashFiles('.github/scripts/agent-voice.js') != '' }}
        run: |
          node -e '
            const { STATES, STATE_PRIORITY } = require("./.github/scripts/agent-voice.js");
            let bad = 0;
            for (const [name, spec] of Object.entries(STATES)) {
              if (!spec.owner) { console.error(`✗ state "${name}" has no owner`); bad++; }
              if (!spec.terminal && !(spec.exits || []).length) {
                console.error(`✗ state "${name}" has no exit — a task in it would never move again`);
                bad++;
              }
              if (!STATE_PRIORITY.includes(name)) {
                console.error(`✗ state "${name}" is missing from STATE_PRIORITY`);
                bad++;
              }
            }
            if (bad) process.exit(1);
            console.log(`✓ ${Object.keys(STATES).length} states, each with an owner and a way out.`);
          '

      - name: Set up JDK 17
        if: ${{ hashFiles('gradlew') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The design-system rule, enforced rather than documented. A screen that writes its own
      # colours and spacing is how a generated product ends up looking like four people built it,
      # and it is the single most common thing a small model does when nobody checks.
      #
      # Both design systems are checked by the same step, because a repo has whichever one it has
      # and neither check costs anything when its files are absent. The Android half looks at
      # *Screen.kt, the web half at page and component styles; each design module is exempt from
      # its own check, since raw values are exactly what a token file is for.
      - name: Lint for raw colours and sizes
        run: |
          colors=""
          sizes=""
          guidance=""

          # --- Android: Compose screens ------------------------------------------------------
          screens="$(git ls-files '*Screen.kt' | grep -v '/mia/design/' || true)"
          if [ -n "$screens" ]; then
            # `[^A-Za-z0-9_.]` before the digits so `Spacing.md` and `Sizes.iconSm` don't match,
            # and a bare `16.dp` does.
            colors="$colors$(grep -nE 'Color\(0x|Color\.(Red|Green|Blue|Yellow|Cyan|Magenta|White|Black|Gray|LightGray|DarkGray)' $screens || true)"
            sizes="$sizes$(grep -nE '(^|[^A-Za-z0-9_.])[0-9]+(\.[0-9]+)?\.(dp|sp)' $screens || true)"
            guidance="${guidance}Kotlin: use MaterialTheme.colorScheme.* for colour and the tokens in app/src/main/java/mia/design/Tokens.kt (Spacing, Radius, Sizes, Elevation, Motion) for every number. Build screens from the components in MiaComponents.kt."$'\n'
          fi

          # --- Web: page and component styles ------------------------------------------------
          # src/styles/ is the design system itself and is exempt. So is anything generated or
          # vendored — a bundled stylesheet is not something an agent wrote.
          styles="$(git ls-files '*.css' '*.scss' | grep -v '^src/styles/' | grep -vE '(^|/)(dist|build|node_modules|vendor)/' || true)"
          if [ -n "$styles" ]; then
            # A raw hex or rgb()/hsl() literal anywhere in a page stylesheet. The tokens file is
            # the only place those belong.
            colors="$colors$(grep -nE '#[0-9a-fA-F]{3,8}\b|\b(rgba?|hsla?)\(' $styles || true)"
            # A bare length: `16px`, `1.5rem`. `var(--space-lg)` has no digits to match, and a
            # 0 with no unit is not a magic number.
            sizes="$sizes$(grep -nE '(^|[^A-Za-z0-9_.#-])[0-9]+(\.[0-9]+)?(px|rem|em)\b' $styles || true)"
            guidance="${guidance}CSS: use the custom properties in src/styles/tokens.css for every colour and every number (--color-*, --space-*, --radius-*, --text-*, --motion-*). Build pages from the classes in src/styles/components.css. See src/example.html."$'\n'
          fi

          if [ -z "$screens" ] && [ -z "$styles" ]; then
            echo "No screens or page styles yet — nothing to check."
            exit 0
          fi
          if [ -z "$colors" ] && [ -z "$sizes" ]; then
            echo "Everything uses the design system."
            exit 0
          fi
          {
            echo "::error::A screen or page style is writing raw colours or sizes instead of using the design system."
            printf '%s\n' "$guidance"
            echo
            echo "If a token you need is missing, add it to the token file — never inline the value."
            echo
            if [ -n "$colors" ]; then
              echo "Raw colours:"
              printf '%s\n' "$colors"
              echo
            fi
            if [ -n "$sizes" ]; then
              echo "Raw sizes:"
              printf '%s\n' "$sizes"
            fi
          } >&2
          exit 1

      - name: Assemble (debug)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No Gradle wrapper yet — nothing to build. Skipping."
          fi
