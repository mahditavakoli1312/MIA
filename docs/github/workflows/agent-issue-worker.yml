# Managed by MIA — do not edit by hand (kept byte-for-byte in sync with docs/github/).
#
# The TEC "doer" agent. It runs when either:
#   • a human comments "@tec ..." on an issue (e.g. "@tec add a logout button"), or
#   • an issue is labeled "by-agent" (the path the MIA app attaches programmatically).
#
# It lets the OpenCode CLI — driven by a FREE OpenRouter model — implement the issue by
# editing files, gates the result on the Gradle build, then opens a pull request from a
# per-issue branch, squash-merges it, and comments back. Nothing is pushed straight to the
# default branch: every change lands through a reviewable, revertable PR that auto-closes
# the issue on merge.
name: Agent Issue Worker (TEC)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Serialize agent runs so two issues can't race each other on the same repo.
concurrency:
  group: agent-worker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  work:
    # Run for a human "@tec" comment, OR the "by-agent" label the MIA app attaches.
    # (For the label event github.event.comment is null; the first clause is simply false.)
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@tec')) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'by-agent')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # Issue title/body are untrusted user input — keep them in env vars and never
      # interpolate them straight into a shell/YAML expression (command injection).
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Acknowledge the request
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛠️ **TEC** picked this up — implementing the change and opening a pull request. Watch the [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." || true

      - name: Build the prompt
        run: |
          {
            echo "You are TEC, an autonomous senior engineer working inside a GitHub Actions runner."
            echo "Implement the following GitHub issue by editing files in the working tree."
            echo "Do NOT run any git commands, do NOT push, and do NOT open pull requests —"
            echo "the workflow commits, opens a PR, and merges it for you afterwards."
            echo "Make the smallest correct change that resolves the issue and keep the project building."
            echo
            echo "Issue #${ISSUE_NUMBER}"
            echo "Title: ${ISSUE_TITLE}"
            echo "Body:"
            echo "${ISSUE_BODY}"
          } > "${RUNNER_TEMP}/agent-prompt.txt"

      # OpenCode reads OPENROUTER_API_KEY automatically (no interactive `opencode auth login`).
      # Models are addressed "provider/model" and OpenCode splits on the FIRST "/", so
      # `openrouter/openai/gpt-oss-120b:free` means provider=openrouter, model=openai/gpt-oss-120b:free.
      # Free OpenRouter models are capped (~200 req/day, ~20/min); override with an AGENT_MODEL
      # repo/environment variable. The step degrades cleanly on a 429 instead of failing red.
      - name: Run OpenCode CLI
        id: agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'openrouter/openai/gpt-oss-120b:free' }}
        run: |
          set -o pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "status=nokey" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          log="${RUNNER_TEMP}/opencode-output.log"
          # `run` is non-interactive; --auto auto-approves file edits so there's no TUI prompt.
          if opencode run --auto -m "$AGENT_MODEL" \
               "$(cat "${RUNNER_TEMP}/agent-prompt.txt")" 2>&1 | tee "$log"; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          elif grep -qiE '429|rate.?limit|quota|exhausted|too many requests|insufficient' "$log"; then
            echo "status=quota" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing OpenRouter key
        if: steps.agent.outputs.status == 'nokey'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'🔑 TEC could not run: no `OPENROUTER_API_KEY` Actions secret is set.\n\nAdd a (free) OpenRouter API key in the MIA app Settings, or in the repository Settings → Secrets and variables → Actions as `OPENROUTER_API_KEY`, then comment `@tec` again (or re-add the by-agent label) to retry.'
          exit 1

      # Free-tier rate/quota exhaustion is expected, not a bug: comment and pass green so the
      # run history isn't a wall of red. The user re-triggers with another @tec comment.
      - name: Report quota exhaustion
        if: steps.agent.outputs.status == 'quota'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'⏳ TEC could not finish: the OpenRouter free-tier quota/rate limit was hit (HTTP 429).\n\nFree models are capped (~200 requests/day, ~20/min). Wait for the quota to reset, point the `AGENT_MODEL` variable at another free model, or add OpenRouter credit — then comment `@tec` again to retry.'

      - name: Report unexpected agent failure
        if: steps.agent.outputs.status == 'error'
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛑 TEC hit an error before making usable changes. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          exit 1

      - name: Verify build (Gradle)
        id: build
        if: steps.agent.outputs.status == 'ok'
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            if ! ./gradlew assembleDebug --stacktrace; then
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No Gradle wrapper found; skipping build gate."
          fi

      - name: Comment on build failure
        if: steps.build.outputs.failed == 'true'
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "🛑 TEC produced changes but \`./gradlew assembleDebug\` failed, so nothing was merged. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

      - name: Fail the job when the build gate failed
        if: steps.build.outputs.failed == 'true'
        run: exit 1

      - name: Open a PR, merge it, and report back
        if: steps.agent.outputs.status == 'ok'
        run: |
          # OpenCode keeps session state under $HOME, but drop any stray in-repo artifacts.
          rm -rf .opencode
          git config user.name "mia-agent[bot]"
          git config user.email "mia-agent[bot]@users.noreply.github.com"

          BRANCH="tec/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "ℹ️ TEC ran but produced no file changes for this issue. Leaving it open for a human to review."
            exit 0
          fi
          git commit -m "tec: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}"

          # Clear any stale branch from a previous run, then push fresh (no force needed).
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push -u origin "$BRANCH"

          # PR body auto-closes the issue on merge. printf keeps the blank line intact.
          PR_BODY="$(printf 'Automated fix for #%s by the TEC agent (OpenCode + free model).\n\nResolves #%s.' "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
          PR_URL="$(gh pr create \
            --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "TEC: resolve #${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            --body "$PR_BODY" 2>/dev/null)" || true
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null || true)"
          fi

          # Squash-merge, retrying while GitHub computes mergeability.
          merged=""
          for _ in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              merged="yes"; break
            fi
            sleep 5
          done

          if [ -n "$merged" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "by-agent" --add-label "done" || true
            gh issue comment "$ISSUE_NUMBER" \
              --body "✅ TEC implemented this and squash-merged ${PR_URL:-the pull request} into \`${DEFAULT_BRANCH}\`."
          elif [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "🔀 TEC opened ${PR_URL} but couldn't auto-merge it (branch protection or a merge conflict). Please review and merge it manually."
          else
            NO_PR_BODY="$(printf '🛑 TEC prepared changes on branch `%s` but could not open a pull request.\n\nIf Actions is not allowed to open PRs here, enable **Settings → Actions → General → Allow GitHub Actions to create and approve pull requests**, then comment `@tec` again.' "$BRANCH")"
            gh issue comment "$ISSUE_NUMBER" --body "$NO_PR_BODY"
          fi
